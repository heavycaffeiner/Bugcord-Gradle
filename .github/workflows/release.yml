name: Release

on:
  push:
    tags: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Build
        run: |
          chmod +x gradlew tools/fetch-deps.sh
          ./tools/fetch-deps.sh
          ./gradlew :publishToMavenLocal --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(ls ~/.m2/repository/com/bugcord/gradle/ | head -n1)"
          test -n "$version"

          files="$(find ~/.m2/repository/com/bugcord -type f \( -name '*.jar' -o -name '*.pom' -o -name '*.module' \) ! -name '*sources*' ! -name '*javadoc*' | tr '\n' ' ')"
          test -n "$files"

          gh release delete "$version" --cleanup-tag --yes || true
          gh release create "$version" $files \
            --title "$version" --notes "Built from $GITHUB_SHA"
